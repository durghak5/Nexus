# docker-compose-simple.yml

services:
  postgres:
    image: postgres:15-alpine
    container_name: medical_ocr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medical_ocr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: